<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>OmniAnd</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <span class="brand-mark" aria-hidden="true">O</span>
      <div>
        <h1>My Web Apps</h1>
        <p>Hosted by this phone and available on your other devices.</p>
      </div>
    </header>

    <section aria-labelledby="apps-title">
      <h2 id="apps-title">Installed apps</h2>
      <div id="web-apps" class="apps" aria-live="polite"><p class="state">Loading…</p></div>
    </section>
  </main>

  <template id="app-template">
    <button class="app-tile" type="button">
      <span class="app-mark" aria-hidden="true"></span>
      <span class="app-name"></span>
    </button>
  </template>

  <div id="menu-backdrop" class="menu-backdrop" hidden>
    <section class="app-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="menu-app"><span id="menu-mark" class="app-mark" aria-hidden="true"></span><h2 id="menu-title"></h2></div>
      <div id="menu-actions" class="menu-actions">
        <button id="menu-update" type="button" hidden disabled>Checking for updates…</button>
        <button id="menu-integrate" type="button">Add to Android</button>
        <button id="menu-uninstall" class="danger" type="button">Uninstall</button>
        <button id="menu-cancel" type="button">Cancel</button>
      </div>
      <div id="uninstall-confirm" class="menu-panel" hidden>
        <p>Uninstall this Web app and delete its local files?</p>
        <div class="menu-buttons">
          <button id="uninstall-back" type="button">Cancel</button>
          <button id="uninstall-confirm-button" class="danger filled" type="button">Uninstall</button>
        </div>
      </div>
      <div id="update-confirm" class="menu-panel" hidden>
        <p>This update adds access to:</p>
        <ul id="update-capabilities" class="capability-list"></ul>
        <div class="menu-buttons">
          <button id="update-back" type="button">Cancel</button>
          <button id="update-confirm-button" class="primary filled" type="button">Update</button>
        </div>
      </div>
      <div id="menu-message" class="menu-panel" hidden>
        <p id="menu-message-text"></p>
        <button id="menu-message-close" class="menu-wide-button" type="button">OK</button>
      </div>
    </section>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
