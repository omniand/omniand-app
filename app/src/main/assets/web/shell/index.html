<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OmniAnd Launcher</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <header><h1>Launcher</h1><p>Phone-hosted apps</p></header>
      <section><h2>Web apps</h2><div id="web-apps" class="apps"><p class="muted">Loading…</p></div></section>
      <section id="android-apps-section" hidden><h2>Android apps</h2><div id="android-apps" class="apps"><p class="muted">Loading…</p></div></section>
    </aside>
    <section id="stage" class="stage" aria-live="polite">
      <div class="welcome"><span>O</span><h2>Your phone is the platform</h2><p>Choose an app from the launcher.</p></div>
    </section>
  </main>
  <template id="app-template"><button class="app"><span class="app-icon"></span><span class="app-name"></span><small></small></button></template>
  <script src="/app.js" defer></script>
</body>
</html>
