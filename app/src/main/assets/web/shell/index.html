<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>OmniAnd</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <span class="brand-mark" aria-hidden="true">O</span>
      <div>
        <h1>My Web Apps</h1>
        <p>Hosted by this phone and available on your other devices.</p>
      </div>
    </header>

    <section aria-labelledby="apps-title">
      <div class="section-heading">
        <h2 id="apps-title">Installed apps</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
      <div id="web-apps" class="apps" aria-live="polite"><p class="state">Loading…</p></div>
    </section>
  </main>

  <template id="app-template">
    <article class="app-card">
      <div class="app-identity">
        <span class="app-mark" aria-hidden="true"></span>
        <div><h3 class="app-name"></h3><p class="app-origin"></p></div>
      </div>
      <div class="actions">
        <button class="open primary" type="button">Open</button>
        <button class="integration secondary" type="button" hidden></button>
      </div>
    </article>
  </template>
  <script src="/app.js" defer></script>
</body>
</html>
